blueprint:
  name: Sunrise Light Simulator Warm
  description: >
    Gradually brighten lights and change color temperature to simulate a warm
    natural sunrise. Uses configurable step intervals with smooth transitions.
    Default values are tuned for a warm orange sunrise rather than a cold white light.
  domain: automation

  input:

    target_lights:
      name: Lights
      description: Select lights by entity, area, device, or label
      selector:
        target: {}

    start_time:
      name: Start Time
      description: Time to start the sunrise simulation
      selector:
        time: {}

    duration:
      name: Duration (minutes)
      description: How long the sunrise should last
      default: 45
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: minutes

    max_brightness:
      name: Maximum Brightness
      description: Maximum brightness at the end
      default: 40
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    start_kelvin:
      name: Starting Color Temperature
      description: Warm temperature when sunrise starts
      default: 1800
      selector:
        number:
          min: 1500
          max: 5000
          step: 100
          unit_of_measurement: K

    end_kelvin:
      name: Ending Color Temperature
      description: Final temperature after sunrise
      default: 3000
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K

    pre_sunrise_actions:
      name: Pre-Sunrise Actions (Optional)
      default: []
      selector:
        action: {}

    post_sunrise_actions:
      name: Post-Sunrise Actions (Optional)
      default: []
      selector:
        action: {}

    step_interval:
      name: Step Interval (seconds)
      description: >
        Time between brightness changes. Lower values = smoother transitions but more service calls; higher values = more compatible with all lights.
        Device recommendations: LIFX 5-10s, Philips Hue 10-15s, Govee/MQTT 15-30s, Generic dimmers 10-20s.
        If you see jarring transitions, try increasing this value.
      default: 30
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: seconds

    startup_brightness:
      name: Startup Brightness (%)
      description: Initial brightness
      default: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    days_of_week:
      name: Days of Week (Optional)
      description: Leave empty to run every day
      default: []
      selector:
        select:
          options:
            - label: Monday
              value: "mon"
            - label: Tuesday
              value: "tue"
            - label: Wednesday
              value: "wed"
            - label: Thursday
              value: "thu"
            - label: Friday
              value: "fri"
            - label: Saturday
              value: "sat"
            - label: Sunday
              value: "sun"
          multiple: true


trigger:

  - platform: time
    at: !input start_time


condition:

  - condition: template
    value_template: >
      {{ days_of_week | length == 0
         or now().strftime('%a').lower()[:3] in days_of_week }}


variables:

  duration: !input duration
  max_brightness: !input max_brightness
  step_interval: !input step_interval
  startup_brightness: !input startup_brightness

  start_kelvin: !input start_kelvin
  end_kelvin: !input end_kelvin

  days_of_week: !input days_of_week

  total_steps: "{{ (duration * 60 / step_interval) | int }}"

  target_lights: !input target_lights

  monitor_entity: >
    {% if target_lights.entity_id is defined %}
      {% if target_lights.entity_id is string %}
        {{ target_lights.entity_id }}
      {% else %}
        {{ target_lights.entity_id[0] }}
      {% endif %}
    {% else %}
      none
    {% endif %}


action:

  - choose: []
    default: !input pre_sunrise_actions


  - action: light.turn_on
    target: !input target_lights
    data:
      brightness_pct: "{{ startup_brightness }}"
      color_temp_kelvin: "{{ start_kelvin }}"
    continue_on_error: true


  - delay:
      seconds: 2


  - repeat:

      while:
        - condition: template
          value_template: "{{ repeat.index <= total_steps }}"

        - condition: template
          value_template: >
            {{ monitor_entity == 'none'
               or is_state(monitor_entity, 'on') }}

      sequence:

        - variables:

            progress: >
              {{ repeat.index / total_steps }}

            brightness: >
              {{
                (
                  startup_brightness +
                  (
                    max_brightness - startup_brightness
                  )
                  *
                  (
                    progress ** 1.3
                  )
                ) | int
              }}

            temperature: >
              {{
                (
                  start_kelvin +
                  (
                    end_kelvin - start_kelvin
                  )
                  *
                  (
                    progress ** 3.5
                  )
                ) | int
              }}


        - action: light.turn_on
          target: !input target_lights

          data:

            brightness_pct: "{{ brightness }}"

            color_temp_kelvin: "{{ temperature }}"

            transition: "{{ step_interval }}"

          continue_on_error: true


        - delay:
            seconds: "{{ step_interval }}"


  - condition: template
    value_template: >
      {{ monitor_entity == 'none'
         or is_state(monitor_entity, 'on') }}


  - action: light.turn_on
    target: !input target_lights

    data:
      brightness_pct: "{{ max_brightness }}"
      color_temp_kelvin: "{{ end_kelvin }}"

    continue_on_error: true


  - choose: []
    default: !input post_sunrise_actions


mode: single